<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mia spesa</title>
<style>
:root{--v:#A78BFA;--i:#818CF8;--mut:#9aa0b4;--line:#ffffff1f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#f2f2f7;
background:radial-gradient(900px 500px at 80% -10%,#3b2b6b66,transparent),linear-gradient(160deg,#1A1A2E,#16213E 70%,#0F3460)}
.card{max-width:560px;margin:22px;padding:40px 30px;text-align:center;
background:#ffffff0d;border:1px solid var(--line);border-radius:24px}
.logo{font-size:54px;margin-bottom:6px}
h1{font-size:30px;font-weight:800;margin:6px 0;
background:linear-gradient(90deg,var(--v),var(--i));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--mut);margin:0 0 26px}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 20px;border-radius:14px;text-decoration:none;font-weight:700;
background:linear-gradient(135deg,var(--v),var(--i));color:#fff}
.btn.ghost{background:#ffffff14;color:#fff;border:1px solid var(--line)}
a.mail{color:var(--v);text-decoration:none}
footer{color:var(--mut);font-size:13px;margin-top:26px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🛒</div>
    <h1>La mia spesa</h1>
    <p>Liste della spesa condivise e tessere fedeltà, sempre con te.</p>
    <div class="links">
      <a class="btn" href="privacy.html">Privacy</a>
      <a class="btn ghost" href="terms.html">Termini di servizio</a>
    </div>
    <footer>Supporto: <a class="mail" href="mailto:nicola.iannone.dev@gmail.com">nicola.iannone.dev@gmail.com</a><br>© 2026 Nicola Iannone</footer>
  </div>
</body>
</html>
